<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Dashboard - eTIMS</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/review/review.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>eTIMS</h1>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/review.html" class="active">Review</a>
        <a href="#" id="logoutBtn">Logout</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <header class="card-header">
          <h2>Review Dashboard</h2>
          <span id="userInfo" class="user-info"></span>
        </header>

        <form id="filterForm" class="filter-form">
          <div class="filter-row">
            <div class="filter-group">
              <label for="businessFilter">Business</label>
              <select id="businessFilter">
                <option value="">All Businesses</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="statusFilter">Status</label>
              <select id="statusFilter" multiple>
                <option value="completed" selected>Completed</option>
                <option value="needs_review" selected>Needs Review</option>
                <option value="partial" selected>Partial</option>
                <option value="pending">Pending</option>
                <option value="processing">Processing</option>
                <option value="failed">Failed</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="dateFrom">From</label>
              <input type="date" id="dateFrom" />
            </div>
            <div class="filter-group">
              <label for="dateTo">To</label>
              <input type="date" id="dateTo" />
            </div>
            <div class="filter-group filter-actions">
              <button type="submit" class="btn btn-primary">Apply</button>
              <button type="button" id="clearFilters" class="btn btn-secondary">Clear</button>
            </div>
          </div>
        </form>

        <div id="loading" class="loading" style="display: none;">Loading batches...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="tableContainer" style="display: none;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Batch ID</th>
                <th>Business</th>
                <th>Created</th>
                <th>Total</th>
                <th>Extracted</th>
                <th>Needs Review</th>
                <th>Rejected</th>
                <th>Failed</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="batchesTableBody"></tbody>
          </table>

          <div id="pagination" class="pagination">
            <button id="prevPage" class="btn btn-secondary" disabled>Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextPage" class="btn btn-secondary" disabled>Next</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/review/review.js"></script>
  <script type="module" src="/review/dashboard.js"></script>
</body>
</html>
