<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eTIMS Login</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #1e40af;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      display: none;
    }
    .message.error {
      display: block;
      color: #ef4444;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }
    .message.success {
      display: block;
      color: #10b981;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }
    header {
      margin-bottom: 0;
      border-radius: 12px 12px 0 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>eTIMS</h1>
    <p>Electronic Tax Invoice Management System</p>
  </header>
  <main style="max-width: 100%; padding: 0;">
    <div class="login-container card">
      <h2 style="text-align:center; margin-bottom:1.5rem; color:#1e3a8a;">Sign In</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="submitBtn">Sign In</button>
      </form>
      <p id="message" class="message"></p>
    </div>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
